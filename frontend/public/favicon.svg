<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rich Teal Gradient for Q Ring & Cross -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Sunrise Amber / Coral Gradient for Pulse Line -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FF7043" />
    </linearGradient>

    <!-- Glow Effect for High Visibility Favicon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0D9488" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Outer 'Q' Circle Ring -->
    <circle cx="30" cy="30" r="22" fill="none" stroke="url(#tealGrad)" stroke-width="5" />

    <!-- 'Q' Tail Line at bottom right -->
    <path d="M42 42 L52 52" stroke="url(#tealGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Central Medical Cross -->
    <!-- Vertical Bar -->
    <rect x="27" y="16" width="6" height="28" rx="2" fill="url(#tealGrad)" />
    <!-- Horizontal Bar -->
    <rect x="16" y="27" width="28" height="6" rx="2" fill="url(#tealGrad)" />

    <!-- Heartbeat / OPD Queue Pulse Wave Line (Option C Sunrise Amber Accent) -->
    <path d="M 6 30 L 18 30 L 22 20 L 27 40 L 32 14 L 37 36 L 41 30 L 56 30"
          fill="none"
          stroke="url(#amberGrad)"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Pulse Arrow Head / End Dot -->
    <circle cx="56" cy="30" r="3" fill="#FF7043" />
  </g>
</svg>